name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Provisioned release gate to run in addition to offline CI
        required: true
        type: choice
        default: offline
        options:
          - offline
          - native
          - hardware

env:
  CARGO_TERM_COLOR: always

jobs:
  toolkit:
    name: Toolkit source and Rust interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Toolkit CLI and test dependencies
        run: |
          python -m venv toolkit-cli/.venv
          toolkit-cli/.venv/bin/python -m pip install -e './toolkit-cli[test,research,serial,usb]'

      - name: Build both Rust interoperability servers
        working-directory: toolkit-cli
        run: make build-interop

      - name: Original C-Gate SESSION_ID differential on both Rust servers
        working-directory: toolkit-cli
        run: make check-session-differential

      - name: Original tagged SESSION_ID wire differential on both Rust servers
        working-directory: toolkit-cli
        run: make check-tagged-session-differential

      - name: Original direct and combined Unit XML mapper differential on both Rust servers
        working-directory: toolkit-cli
        run: make check-dbsetxml-unit-differential

      - name: Native DBGETXML wire framing on both Rust servers
        working-directory: toolkit-cli
        run: make check-dbgetxml-wire-interop

      - name: Toolkit offline suite
        working-directory: toolkit-cli
        run: >-
          make check-offline
          PYTEST_EXTRA="-p research.ci_test_results --cbus-ci-trace=${RUNNER_TEMP}/toolkit-offline-trace.json --junitxml=${RUNNER_TEMP}/toolkit-offline.xml -ra"

      - name: Audit Toolkit offline execution and skips
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: >-
          .venv/bin/python research/ci_test_results.py
          --selection offline
          --junit "${RUNNER_TEMP}/toolkit-offline.xml"
          --trace "${RUNNER_TEMP}/toolkit-offline-trace.json"
          --output "${RUNNER_TEMP}/toolkit-offline-results.json"
          --require-module tests/test_edlt_app_group_label_controls.py
          --require-module tests/test_edlt_app_group_label_properties.py
          --require-module tests/test_edlt_app_group_label_static.py
          --require-module tests/test_edlt_scene_widget_controls.py
          --require-module tests/test_edlt_scene_widget_properties.py
          --require-module tests/test_edlt_global_image_context.py
          --require-module tests/test_native_global_image_context.py
          --require-module tests/test_cli_edlt_global_images.py
          --require-module tests/test_edlt_parent_widget_controls.py
          --require-module tests/test_edlt_mra_control_static.py
          --require-module tests/test_edlt_mra_controls.py
          --require-module tests/test_edlt_parent_mra_controls.py
          --require-module tests/test_edlt_dual_key_control_static.py
          --require-module tests/test_edlt_dual_key_controls.py
          --require-module tests/test_edlt_parent_dual_key_controls.py
          --require-module tests/test_edlt_time_date_control_static.py
          --require-module tests/test_edlt_time_date_controls.py
