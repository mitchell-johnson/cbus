name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Provisioned release gate to run in addition to offline CI
        required: true
        type: choice
        default: offline
        options:
          - offline
          - native
          - hardware

env:
  CARGO_TERM_COLOR: always

jobs:
  toolkit:
    name: Toolkit source and Rust interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Toolkit CLI and test dependencies
        run: |
          python -m venv toolkit-cli/.venv
          toolkit-cli/.venv/bin/python -m pip install -e './toolkit-cli[test,research,serial,usb]'

      - name: Build both Rust interoperability servers
        working-directory: toolkit-cli
        run: make build-interop

      - name: Original C-Gate SESSION_ID differential on both Rust servers
        working-directory: toolkit-cli
        run: make check-session-differential

      - name: Original tagged SESSION_ID wire differential on both Rust servers
        working-directory: toolkit-cli
        run: make check-tagged-session-differential

      - name: Original direct and combined Unit XML mapper differential on both Rust servers
        working-directory: toolkit-cli
        run: make check-dbsetxml-unit-differential

      - name: Native DBGETXML wire framing on both Rust servers
        working-directory: toolkit-cli
        run: make check-dbgetxml-wire-interop

      - name: Toolkit offline suite
        working-directory: toolkit-cli
        run: >-
          make check-offline
          PYTEST_EXTRA="-p research.ci_test_results --cbus-ci-trace=${RUNNER_TEMP}/toolkit-offline-trace.json --junitxml=${RUNNER_TEMP}/toolkit-offline.xml -ra"

      - name: Audit Toolkit offline execution and skips
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: >-
          .venv/bin/python research/ci_test_results.py
          --selection offline
          --junit "${RUNNER_TEMP}/toolkit-offline.xml"
          --trace "${RUNNER_TEMP}/toolkit-offline-trace.json"
          --output "${RUNNER_TEMP}/toolkit-offline-results.json"
          --require-module tests/test_edlt_scene_name_control.py
          --require-module tests/test_edlt_scene_names.py
          --require-module tests/test_edlt_scene_name_static.py
          --require-module tests/test_edlt_parent_scene_names.py
          --require-module tests/test_edlt_scene_selectors.py
          --require-module tests/test_edlt_scene_selector_control.py
          --require-module tests/test_edlt_scene_selector_static.py
          --require-module tests/test_edlt_scene_selector_metadata.py
          --require-module tests/test_edlt_scene_inventory_timeline.py
          --require-module tests/test_edlt_scene_inventory_native_plan.py
          --require-module tests/test_edlt_scene_inventory_model.py
          --require-module tests/test_edlt_scene_inventory_static.py
          --require-module tests/test_edlt_parent_scene_inventory.py
          --require-module tests/test_edlt_scene_button_control.py
          --require-module tests/test_edlt_scene_button_model.py
          --require-module tests/test_edlt_scene_button_native.py
          --require-module tests/test_edlt_scene_language_initializer.py
          --require-module tests/test_edlt_scene_language_native.py
          --require-module tests/test_edlt_parent_scene_language.py
          --require-module tests/test_toolkit_obligation_reconcile.py
          --require-module tests/test_cli_coverage_reconcile.py
          --summary "${GITHUB_STEP_SUMMARY}"

      - name: Python client against cgate-mock
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: >-
          make check-cgate-interop
          CGATE_INTEROP_PYTEST_EXTRA="-p research.ci_test_results --cbus-ci-trace=${RUNNER_TEMP}/cgate-interop-trace.json --junitxml=${RUNNER_TEMP}/cgate-interop.xml -ra"

      - name: Audit cgate-mock interoperability execution
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: >-
          .venv/bin/python research/ci_test_results.py
          --selection cgate-mock
          --junit "${RUNNER_TEMP}/cgate-interop.xml"
          --trace "${RUNNER_TEMP}/cgate-interop-trace.json"
          --output "${RUNNER_TEMP}/cgate-interop-results.json"
          --require-module tests/test_rust_cgate_interop.py
          --require-module tests/test_cgate_named_database_interop.py
          --require-module tests/test_cgate_barcode_database_interop.py
          --require-module tests/test_cgate_neopro_csv_interop.py
          --require-module tests/test_cgate_toolkit_tweaker_interop.py
          --require-module tests/test_cgate_toolkit_tweaker_lifecycle_interop.py
          --require-module tests/test_cgate_csv_families_interop.py
          --require-module tests/test_cgate_edlt_scene_add_dialog_interop.py
          --require-module tests/test_cgate_toolkit_tweaker_dlt_interop.py
          --require-module tests/test_cgate_toolkit_tweaker_remaining_interop.py
          --require-module tests/test_cgate_csv_completion_interop.py
          --require-module tests/test_cgate_edlt_parent_add_dialog_interop.py
          --require-module tests/test_cgate_csv_last_profiles_interop.py
          --require-module tests/test_cgate_project_documentation_interop.py
          --require-module tests/test_cgate_edlt_application_reset_add_interop.py
          --require-module tests/test_cgate_edlt_static_language_add_interop.py
          --require-module tests/test_cgate_project_documentation_sensors_interop.py
          --require-module tests/test_cgate_project_documentation_wireless_interop.py
          --require-module tests/test_cgate_project_documentation_l1_interop.py
          --require-module tests/test_cgate_project_documentation_architectural_interop.py
          --require-module tests/test_cgate_edlt_static_grid_editor_interop.py
          --require-module tests/test_cgate_project_documentation_native_addresses_interop.py
          --require-module tests/test_cgate_project_documentation_st7_light_level_interop.py
          --require-module tests/test_cgate_edlt_scene_name_control_interop.py
          --require-module tests/test_cgate_edlt_scene_selector_interop.py
          --require-module tests/test_cgate_edlt_scene_inventory_interop.py
          --require-module tests/test_cgate_edlt_scene_controls_language_interop.py
          --require-module tests/test_cgate_edlt_lighting_images_interop.py
          --summary "${GITHUB_STEP_SUMMARY}"

      - name: Python client against cmqttd
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: >-
          make check-cmqtt-interop
          CMQTT_INTEROP_PYTEST_EXTRA="-p research.ci_test_results --cbus-ci-trace=${RUNNER_TEMP}/cmqttd-interop-trace.json --junitxml=${RUNNER_TEMP}/cmqttd-interop.xml -ra"

      - name: Audit cmqttd interoperability execution
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: >-
          .venv/bin/python research/ci_test_results.py
          --selection cmqttd
          --junit "${RUNNER_TEMP}/cmqttd-interop.xml"
          --trace "${RUNNER_TEMP}/cmqttd-interop-trace.json"
          --output "${RUNNER_TEMP}/cmqttd-interop-results.json"
          --require-module tests/test_cmqtt_interop.py
          --require-module tests/test_cmqtt_programming_methods_interop.py
          --require-module tests/test_cmqtt_dali_commissioning_interop.py
          --require-module tests/test_cmqtt_network_new_cli.py
          --require-module tests/test_cgate_named_database_interop.py
          --require-module tests/test_cgate_barcode_database_interop.py
          --require-module tests/test_cgate_neopro_csv_interop.py
          --require-module tests/test_cgate_toolkit_tweaker_interop.py
          --require-module tests/test_cgate_toolkit_tweaker_lifecycle_interop.py
          --require-module tests/test_cgate_csv_families_interop.py
          --require-module tests/test_cgate_edlt_scene_add_dialog_interop.py
          --require-module tests/test_cgate_toolkit_tweaker_dlt_interop.py
          --require-module tests/test_cgate_toolkit_tweaker_remaining_interop.py
          --require-module tests/test_cgate_csv_completion_interop.py
          --require-module tests/test_cgate_edlt_parent_add_dialog_interop.py
          --require-module tests/test_cgate_csv_last_profiles_interop.py
          --require-module tests/test_cgate_project_documentation_interop.py
          --require-module tests/test_cgate_edlt_application_reset_add_interop.py
          --require-module tests/test_cgate_edlt_static_language_add_interop.py
          --require-module tests/test_cgate_project_documentation_sensors_interop.py
          --require-module tests/test_cgate_project_documentation_wireless_interop.py
          --require-module tests/test_cgate_project_documentation_l1_interop.py
          --require-module tests/test_cgate_project_documentation_architectural_interop.py
          --require-module tests/test_cgate_edlt_static_grid_editor_interop.py
          --require-module tests/test_cgate_project_documentation_native_addresses_interop.py
          --require-module tests/test_cgate_project_documentation_st7_light_level_interop.py
          --require-module tests/test_cgate_edlt_scene_name_control_interop.py
          --require-module tests/test_cgate_edlt_scene_selector_interop.py
          --require-module tests/test_cgate_edlt_scene_inventory_interop.py
          --require-module tests/test_cgate_edlt_scene_controls_language_interop.py
          --require-module tests/test_cgate_edlt_lighting_images_interop.py
          --require-module tests/test_cmqtt_network_save_db_cli.py
          --require-module tests/test_cgate_file_upload.py
          --summary "${GITHUB_STEP_SUMMARY}"

      - name: Retain executed Toolkit tests and skips
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/toolkit-offline.xml
            ${{ runner.temp }}/toolkit-offline-trace.json
            ${{ runner.temp }}/toolkit-offline-results.json
            ${{ runner.temp }}/cgate-interop.xml
            ${{ runner.temp }}/cgate-interop-trace.json
            ${{ runner.temp }}/cgate-interop-results.json
            ${{ runner.temp }}/cmqttd-interop.xml
            ${{ runner.temp }}/cmqttd-interop-trace.json
            ${{ runner.temp }}/cmqttd-interop-results.json
            toolkit-cli/research/runtime/cgate-session-differential-mock.json
            toolkit-cli/research/runtime/cgate-session-differential-cmqttd.json
            toolkit-cli/research/runtime/cgate-tagged-session-differential-mock.json
            toolkit-cli/research/runtime/cgate-tagged-session-differential-cmqttd.json
            toolkit-cli/research/runtime/cgate-dbsetxml-unit-differential-mock.json
            toolkit-cli/research/runtime/cgate-dbsetxml-unit-differential-cmqttd.json

  toolkit-wheel:
    name: Toolkit isolated installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test an installed wheel outside the source tree
        working-directory: toolkit-cli
        run: >-
          make check-wheel WHEEL_PY=python
          PYTEST_EXTRA="-p research.ci_test_results --cbus-ci-trace=${RUNNER_TEMP}/toolkit-wheel-trace.json --junitxml=${RUNNER_TEMP}/toolkit-wheel.xml -ra"

      - name: Audit installed-wheel execution and skips
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: >-
          python research/ci_test_results.py
          --selection installed-wheel
          --junit "${RUNNER_TEMP}/toolkit-wheel.xml"
          --trace "${RUNNER_TEMP}/toolkit-wheel-trace.json"
          --output "${RUNNER_TEMP}/toolkit-wheel-results.json"
          --summary "${GITHUB_STEP_SUMMARY}"

      - name: Retain installed-wheel tests and provisioning skips
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-wheel-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/toolkit-wheel.xml
            ${{ runner.temp }}/toolkit-wheel-trace.json
            ${{ runner.temp }}/toolkit-wheel-results.json

  toolkit-native-release:
    name: Provisioned native release gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate == 'native' }}
    runs-on: [self-hosted, macOS, cbus-native]
    environment: cbus-native
    timeout-minutes: 240
    env:
      CBUS_CGATE_JAVA: ${{ vars.CBUS_CGATE_JAVA }}
      CBUS_CGATE_JAVAC: ${{ vars.CBUS_CGATE_JAVAC }}
      CBUS_LOCAL_CGATE_VENDOR: ${{ vars.CBUS_LOCAL_CGATE_VENDOR }}
      CBUS_UNITSPEC_DIR: ${{ vars.CBUS_UNITSPEC_DIR }}
      # tests/conftest.py then owns the loopback C-Gate test host.
      CBUS_NATIVE_SERVICE_BACKEND: local
      CBUS_NATIVE_TLS_TEST: '1'
      CBUS_SCENE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      # The native/cmqttd PROJECT ARCHIVE interchange test needs cmqttd.
      - name: Build the cmqttd binary under test
        working-directory: rust
        run: |
          cargo build -p cmqttd
          printf 'CBUS_CMQTTD_BIN=%s\n' "${GITHUB_WORKSPACE}/rust/target/debug/cmqttd" >> "$GITHUB_ENV"

      - name: Build and install the exact Toolkit wheel under test
        run: |
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/gate-dist" ./toolkit-cli
          python -m venv toolkit-cli/.venv
          wheel=$(find "${RUNNER_TEMP}/gate-dist" -maxdepth 1 -name 'cbus_toolkit_cli-*.whl' -print -quit)
          test -n "$wheel"
          toolkit-cli/.venv/bin/python -m pip install "${wheel}[test,research,serial,usb]"
          printf 'CBUS_TOOLKIT_WHEEL=%s\n' "$wheel" >> "$GITHUB_ENV"

      - name: Run strict native acceptance selection
        working-directory: toolkit-cli
        run: >-
          make check-native
          NATIVE_GATE_JUNIT="${RUNNER_TEMP}/native-gate.xml"
          NATIVE_GATE_OUTPUT="${RUNNER_TEMP}/native-gate.json"

      - name: Enforce full parity completion
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: .venv/bin/cbus-toolkit coverage --evidence-root . --require-complete

      - name: Retain native gate receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-native-gate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-gate.xml
            ${{ runner.temp }}/native-gate.json

  toolkit-hardware-release:
    name: Provisioned physical-hardware release gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate == 'hardware' }}
    runs-on: [self-hosted, cbus-hardware]
    environment: cbus-hardware
    timeout-minutes: 360
    env:
      CBUS_HARDWARE_GATE_MANIFEST: ${{ vars.CBUS_HARDWARE_GATE_MANIFEST }}
      CBUS_HARDWARE_ACCEPTANCE: ${{ vars.CBUS_HARDWARE_ACCEPTANCE }}
      CBUS_CGATE_TEST_HOST: ${{ vars.CBUS_CGATE_TEST_HOST }}
      CBUS_CGATE_TEST_PORT: ${{ vars.CBUS_CGATE_TEST_PORT }}
      CBUS_UNITSPEC_DIR: ${{ vars.CBUS_UNITSPEC_DIR }}
      CBUS_TOOLKIT_EXE: ${{ vars.CBUS_TOOLKIT_EXE }}
      CBUS_TOOLKIT_HELP_DIR: ${{ vars.CBUS_TOOLKIT_HELP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and install the exact Toolkit wheel under test
        run: |
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/gate-dist" ./toolkit-cli
          python -m venv toolkit-cli/.venv
          wheel=$(find "${RUNNER_TEMP}/gate-dist" -maxdepth 1 -name 'cbus_toolkit_cli-*.whl' -print -quit)
          test -n "$wheel"
          toolkit-cli/.venv/bin/python -m pip install "${wheel}[test,research,serial,usb]"
          printf 'CBUS_TOOLKIT_WHEEL=%s\n' "$wheel" >> "$GITHUB_ENV"

      - name: Run strict hardware acceptance selection
        working-directory: toolkit-cli
        run: >-
          make check-hardware
          HARDWARE_GATE_JUNIT="${RUNNER_TEMP}/hardware-gate.xml"
          HARDWARE_GATE_OUTPUT="${RUNNER_TEMP}/hardware-gate.json"

      - name: Enforce full parity completion
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: .venv/bin/cbus-toolkit coverage --evidence-root . --require-complete

      - name: Retain hardware gate receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-hardware-gate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hardware-gate.xml
            ${{ runner.temp }}/hardware-gate.json

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        working-directory: rust
        run: cargo fmt --check

      - name: Lint
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test --workspace

      - name: Build release binaries
        working-directory: rust
        run: cargo build --release --workspace
