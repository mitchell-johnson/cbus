          --require-module tests/test_edlt_dual_key_controls.py
          --require-module tests/test_edlt_parent_dual_key_controls.py
          --require-module tests/test_edlt_time_date_control_static.py
          --require-module tests/test_edlt_time_date_controls.py
          --require-module tests/test_edlt_parent_time_date_controls.py
          --require-module tests/test_edlt_parent_repository_uncertainty.py
          --require-module tests/test_cgate_repository_uncertainty.py
          --require-module tests/test_project_documentation_neo_profiles.py
          --require-module tests/test_application_events.py
          --require-module tests/test_cli_din_controls.py
          --require-module tests/test_cli_firmware_ncc.py
          --require-module tests/test_cli_neo_indicator_editor.py
          --require-module tests/test_cli_senll_controls.py
          --require-module tests/test_cli_senlla_surface.py
          --require-module tests/test_cli_sensors.py
          --require-module tests/test_din_output_controls.py
          --require-module tests/test_firmware_diagnostics.py
          --require-module tests/test_firmware_ncc.py
          --require-module tests/test_input_options.py
          --require-module tests/test_light_level_sensors.py
          --require-module tests/test_native_sensor_scenes.py
          --require-module tests/test_neo_indicator_editor.py
          --require-module tests/test_senll_control_history.py
          --require-module tests/test_senll_global_status.py
          --require-module tests/test_senll_source_inventory.py
          --require-module tests/test_senlla_surface.py
          --require-module tests/test_thermostat_remote_references.py
          --require-module tests/test_thermostat_settings.py
          --require-module tests/test_thermostat_remote_levels.py
          --require-module tests/test_thermostat_output_groups.py
