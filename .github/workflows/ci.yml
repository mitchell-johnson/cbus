      - name: Retain installed-wheel tests and provisioning skips
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-wheel-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/toolkit-wheel.xml
            ${{ runner.temp }}/toolkit-wheel-trace.json
            ${{ runner.temp }}/toolkit-wheel-results.json

  toolkit-wheel-rust-interop:
    name: Toolkit installed wheel and Rust interoperability (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        backend: [mock, daemon]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build both owned Rust interoperability servers
        working-directory: toolkit-cli
        run: make build-interop

      - name: Require complete installed-wheel Rust interoperability selections
        working-directory: toolkit-cli
        run: >-
          make check-wheel-interop WHEEL_PY=python
          WHEEL_INTEROP_BACKEND=${{ matrix.backend }} WHEEL_INTEROP_TIMEOUT=14400
          WHEEL_INTEROP_OUTPUT="${RUNNER_TEMP}/toolkit-wheel-rust-interop-${{ matrix.backend }}"

      - name: Retain installed-wheel Rust execution and import evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-wheel-rust-interop-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/toolkit-wheel-rust-interop-${{ matrix.backend }}

  toolkit-wheel-rust-interop-matrix:
    name: Toolkit installed wheel and Rust interoperability
    needs: [toolkit-wheel-rust-interop]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Retrieve full mock backend evidence
        uses: actions/download-artifact@v4
        with:
          name: toolkit-wheel-rust-interop-mock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheel-matrix/mock

      - name: Retrieve full daemon backend evidence
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          name: toolkit-wheel-rust-interop-daemon-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheel-matrix/daemon

      - name: Require both complete backend epochs and matching input payloads
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: >-
          python research/installed_rust_interop.py audit-backend-matrix
          --summary "${RUNNER_TEMP}/wheel-matrix/mock/summary.json"
          --summary "${RUNNER_TEMP}/wheel-matrix/daemon/summary.json"
          --output "${RUNNER_TEMP}/wheel-matrix/aggregate/summary.json"
          --job-result "${{ needs.toolkit-wheel-rust-interop.result }}"

      - name: Retain combined backend audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-wheel-rust-interop-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/wheel-matrix/aggregate

  toolkit-native-release:
    name: Provisioned native release gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate == 'native' }}
    runs-on: [self-hosted, macOS, cbus-native]
    environment: cbus-native
    timeout-minutes: 240
    env:
      CBUS_CGATE_JAVA: ${{ vars.CBUS_CGATE_JAVA }}
      CBUS_CGATE_JAVAC: ${{ vars.CBUS_CGATE_JAVAC }}
      CBUS_LOCAL_CGATE_VENDOR: ${{ vars.CBUS_LOCAL_CGATE_VENDOR }}
      CBUS_UNITSPEC_DIR: ${{ vars.CBUS_UNITSPEC_DIR }}
      # tests/conftest.py then owns the loopback C-Gate test host.
      CBUS_NATIVE_SERVICE_BACKEND: local
      CBUS_NATIVE_TLS_TEST: '1'
      CBUS_SCENE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable

      # The native/cmqttd PROJECT ARCHIVE interchange test needs cmqttd.
      - name: Build the cmqttd binary under test
        working-directory: rust
        run: |
          cargo build -p cmqttd
          printf 'CBUS_CMQTTD_BIN=%s\n' "${GITHUB_WORKSPACE}/rust/target/debug/cmqttd" >> "$GITHUB_ENV"

      - name: Build and install the exact Toolkit wheel under test
        run: |
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/gate-dist" ./toolkit-cli
          python -m venv toolkit-cli/.venv
          wheel=$(find "${RUNNER_TEMP}/gate-dist" -maxdepth 1 -name 'cbus_toolkit_cli-*.whl' -print -quit)
          test -n "$wheel"
          toolkit-cli/.venv/bin/python -m pip install "${wheel}[test,research,serial,usb]"
          printf 'CBUS_TOOLKIT_WHEEL=%s\n' "$wheel" >> "$GITHUB_ENV"

      - name: Run strict native acceptance selection
        working-directory: toolkit-cli
        run: >-
          make check-native
          NATIVE_GATE_JUNIT="${RUNNER_TEMP}/native-gate.xml"
          NATIVE_GATE_OUTPUT="${RUNNER_TEMP}/native-gate.json"

      - name: Enforce full parity completion
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: .venv/bin/cbus-toolkit coverage --evidence-root . --require-complete

      - name: Retain native gate receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-native-gate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-gate.xml
            ${{ runner.temp }}/native-gate.json

  toolkit-hardware-release:
    name: Provisioned physical-hardware release gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate == 'hardware' }}
    runs-on: [self-hosted, cbus-hardware]
    environment: cbus-hardware
    timeout-minutes: 360
    env:
      CBUS_HARDWARE_GATE_MANIFEST: ${{ vars.CBUS_HARDWARE_GATE_MANIFEST }}
      CBUS_HARDWARE_ACCEPTANCE: ${{ vars.CBUS_HARDWARE_ACCEPTANCE }}
      CBUS_CGATE_TEST_HOST: ${{ vars.CBUS_CGATE_TEST_HOST }}
      CBUS_CGATE_TEST_PORT: ${{ vars.CBUS_CGATE_TEST_PORT }}
      CBUS_UNITSPEC_DIR: ${{ vars.CBUS_UNITSPEC_DIR }}
      CBUS_TOOLKIT_EXE: ${{ vars.CBUS_TOOLKIT_EXE }}
      CBUS_TOOLKIT_HELP_DIR: ${{ vars.CBUS_TOOLKIT_HELP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and install the exact Toolkit wheel under test
        run: |
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/gate-dist" ./toolkit-cli
          python -m venv toolkit-cli/.venv
          wheel=$(find "${RUNNER_TEMP}/gate-dist" -maxdepth 1 -name 'cbus_toolkit_cli-*.whl' -print -quit)
          test -n "$wheel"
          toolkit-cli/.venv/bin/python -m pip install "${wheel}[test,research,serial,usb]"
          printf 'CBUS_TOOLKIT_WHEEL=%s\n' "$wheel" >> "$GITHUB_ENV"

      - name: Run strict hardware acceptance selection
        working-directory: toolkit-cli
        run: >-
          make check-hardware
          HARDWARE_GATE_JUNIT="${RUNNER_TEMP}/hardware-gate.xml"
          HARDWARE_GATE_OUTPUT="${RUNNER_TEMP}/hardware-gate.json"

      - name: Enforce full parity completion
        if: ${{ always() }}
        working-directory: toolkit-cli
        run: .venv/bin/cbus-toolkit coverage --evidence-root . --require-complete

      - name: Retain hardware gate receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-hardware-gate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hardware-gate.xml
            ${{ runner.temp }}/hardware-gate.json

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        working-directory: rust
        run: cargo fmt --check

      - name: Lint
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test --workspace

      - name: Build release binaries
        working-directory: rust
        run: cargo build --release --workspace
