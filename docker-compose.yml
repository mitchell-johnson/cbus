services:
  cbus:
    build:
      context: .
      dockerfile: Dockerfile
    image: cmqttd
    container_name: cbus
    restart: always
    ports:
      - "127.0.0.1:20023:20023"
    environment:
      CMQTTD_CGATE_BIND: ${CMQTTD_CGATE_BIND:-0.0.0.0:20023}
      CMQTTD_CGATE_STATE: /var/lib/cmqttd/cgate.json
    volumes:
      - cmqttd_data:/var/lib/cmqttd
    env_file:
      - .env

volumes:
  cmqttd_data:
