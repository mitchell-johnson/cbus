[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cbus-toolkit-cli"
version = "0.1.0"
description = "Python C-Bus commissioning CLI with explicit compatibility evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
dependencies = []

[project.optional-dependencies]
research = ["cryptography>=43", "pefile==2024.8.26", "unicorn==2.1.4", "capstone==5.0.7"]
serial = ["pyserial==3.5"]
usb = ["pyusb==1.3.1"]
test = ["pytest>=8"]

[project.scripts]
cbus-toolkit = "cbus_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cbus_toolkit = ["*.json"]
